{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 py-3">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-primary-subtle text-primary rounded-3 p-2 me-3">
                            <i class="fas fa-edit fa-lg"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0">Edit Category</h5>
                            <p class="text-muted small mb-0">Modify details for: <span class="text-primary">{{ category.main_cat_name }}</span></p>
                        </div>
                    </div>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category Name*</label>
                                <input type="text" name="main_cat_name" value="{{ category.main_cat_name }}" class="form-control shadow-none border-secondary-subtle" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Slug</label>
                                <input type="text" name="cat_slug" value="{{ category.cat_slug }}" class="form-control shadow-none border-secondary-subtle">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Category Image</label>
                                <div class="d-flex align-items-center gap-3 p-3 border rounded-3 bg-light-subtle">
                                    {% if category.cat_image %}
                                        <img src="{{ category.cat_image.url }}" class="rounded shadow-sm" style="width: 60px; height: 60px; object-fit: cover;">
                                    {% endif %}
                                    <div class="flex-grow-1">
                                        <input type="file" name="cat_image" class="form-control form-control-sm shadow-none">
                                        <small class="text-muted mt-1 d-block">Leave empty to keep current image</small>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea name="description" class="form-control shadow-none border-secondary-subtle" rows="4">{{ category.description }}</textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="{% url 'product_main_category_list' %}" class="btn btn-light border px-4 rounded-pill fw-medium">
                                <i class="fas fa-times me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill fw-medium shadow-sm">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-primary-subtle { background-color: #e7f0ff !important; }
    .form-control:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.25 margin rgba(78, 115, 223, 0.1);
    }
    .icon-box {
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
{% endblock %}

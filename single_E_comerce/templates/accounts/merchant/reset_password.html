{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | QuickAuth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #dc2626;
            --bg-soft: #f8fafc;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body { 
            background-color: var(--bg-soft); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            font-family: 'Inter', -apple-system, sans-serif;
            color: #1e293b;
        }

        .auth-card { 
            border: none; 
            border-radius: 1.5rem; 
            box-shadow: var(--card-shadow); 
            width: 100%; 
            max-width: 460px; 
            margin: auto; 
            background: #ffffff; 
            overflow: hidden;
        }

        .card-header-custom {
            padding: 2.5rem 2.5rem 1rem;
            text-align: center;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        /* OTP Input Styling */
        .otp-wrapper {
            background: #fffefe;
            padding: 1rem;
            border-radius: 1rem;
            border: 2px dashed #a8a2a2;
        }

        .otp-input { 
            letter-spacing: 0.8rem; 
            font-weight: 800; 
            text-align: center; 
            font-size: 1.75rem; 
            border: none !important;
            background: transparent !important;
            color: var(--danger-color) !important;
            padding: 0;
        }

        .otp-input:focus {
            box-shadow: none !important;
            outline: none;
        }

        /* Password Input Groups */
        .custom-input-group {
            position: relative;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .custom-input-group:focus-within {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-control-custom {
            border: none !important;
            background: transparent !important;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 0.95rem;
        }

        .form-control-custom:focus {
            box-shadow: none !important;
            outline: none;
        }

        .toggle-password {
            padding: 0 1rem;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        /* Button */
        .btn-submit {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .back-link {
            color: #64748b;
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .alert {
            border-radius: 0.75rem;
            font-size: 0.85rem;
            background-color: #ebc2b9;
            color: red;
            border: none;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="card auth-card">
        <div class="card-header-custom">
            <h3 class="fw-bold mb-1">Set New Password</h3>
            <p class="text-muted small">Enter the 6-digit code sent to<br>
                <span class="text-dark fw-bold">{{ email }}</span>
            </p>
        </div>

        <div class="card-body px-4 px-md-5 pb-5">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'merchant_reset_password' %}?email={{ email }}" method="POST">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label">VERIFICATION CODE</label>
                    <div class="otp-wrapper">
                        <input type="text" name="otp" class="form-control otp-input" maxlength="6" placeholder="000000" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">NEW PASSWORD</label>
                    <div class="custom-input-group">
                        <input type="password" name="new_password" id="new_password" class="form-control-custom" placeholder="At least 6 characters" required>
                        <div class="toggle-password" data-target="new_password">
                            <i class="fas fa-eye-slash eye-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">CONFIRM PASSWORD</label>
                    <div class="custom-input-group">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control-custom" placeholder="Repeat new password" required>
                        <div class="toggle-password" data-target="confirm_password">
                            <i class="fas fa-eye-slash eye-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-submit">Update Password</button>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'merchant_login' %}" class="back-link">
                    <i class="fas fa-arrow-left me-2"></i>Back to login
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('.eye-icon');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

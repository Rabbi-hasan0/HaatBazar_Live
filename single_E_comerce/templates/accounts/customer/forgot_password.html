{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | HaatBazar Security</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/admin/otp_request.css' %}">

</head>
<body>
    <div class="otp-card">
        <div class="brand-logo">
            <div class="icon-box">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="mb-2">Forgot Password?</h3>
            <p class="text-muted mb-4">Enter your email and we'll send you an OTP to reset your password.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ message }}
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'forgot_password' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group-custom">
                    <input type="email" name="email" class="form-control" placeholder="Enter your email..." required>
                </div>
            </div>

            <button type="submit" class="btn-send">
                Send OTP
            </button>
        </form>

        <div class="back-to-login">
            <a href="{% url 'customer_login' %}">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

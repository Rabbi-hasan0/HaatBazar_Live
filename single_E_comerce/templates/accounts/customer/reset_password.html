{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | QuickAuth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .auth-card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); width: 100%; max-width: 450px; margin: auto; }
        .btn-primary { padding: 0.8rem; font-weight: 600; border-radius: 0.5rem; }
        .otp-input { letter-spacing: 0.5rem; font-weight: bold; text-align: center; font-size: 1.2rem; }
        .alert-error{
            color: red;
            background: #ecc9bc;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card auth-card">
        <div class="card-body p-5">
            <h3 class="text-center mb-2">Set New Password</h3>
            <p class="text-center text-muted small mb-4">We've sent a 6-digit code to <strong>{{ email }}</strong></p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        <small>{{ message }}</small>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'reset_password' %}?email={{ email }}" method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Verification Code</label>
                    <input type="text" name="otp" class="form-control otp-input" maxlength="6" placeholder="------" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">New Password</label>
                    <div class="input-group">
                        <input type="password" name="new_password" class="form-control bg-light border-start-0" placeholder="Enter new password min. 6 characters" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" name="confirm_password" class="form-control bg-light border-start-0" placeholder="Repeat password" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function (e) {
        e.preventDefault();
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

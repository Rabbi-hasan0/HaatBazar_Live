{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Secure Access</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'website/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/admin/otp_verify.css' %}">
</head>

<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card otp-card">
                    <div class="card-header-custom">
                        <div class="shop-name-container mb-2 text-center">
                            <h4 class="fw-bold shop-name-text">
                                Verify Your Account
                            </h4>
                        </div>
                        <p class="text-muted small px-2">
                            Enter the 6-digit code sent to <br> 
                            <span class="text-dark fw-bold">{{ email }}</span>
                        </p>
                    </div>

                    <div class="card-body p-4 pt-2">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
                                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" style="padding: 0.8rem;"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post" id="otp-form" autocomplete="off">
                            {% csrf_token %}
                            <input type="hidden" name="otp" id="full-otp">
                            
                            <div class="otp-inputs">
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required autofocus>
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required>
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required>
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required>
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required>
                                <input type="text" class="otp-field" maxlength="1" pattern="\d*" inputmode="numeric" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-verify w-100 mb-3">
                                Verify Now
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="small text-muted mb-1">Didn't get the code?</p>
                            <a href="{% url 'request_otp_for_customer' %}?email={{ email }}" class="resend-link small">
                                <i class="fa-solid fa-rotate-right me-1"></i> Resend Code
                            </a>
                        </div>
                    </div>
                    
                    <div class="card-footer bg-transparent border-0 pb-4 text-center">
                        <a href="{% url 'customer_login' %}" class="text-decoration-none small text-secondary">
                            <i class="fa-solid fa-chevron-left me-1" style="font-size: 10px;"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const inputs = document.querySelectorAll('.otp-field');
        const fullOtpInput = document.getElementById('full-otp');
        const form = document.getElementById('otp-form');

        inputs.forEach((input, index) => {
            // ১. টাইপ করার সময় অটো-ফোকাস লজিক
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                combineOtp();
            });

            // ২. ব্যাকস্পেস দিলে আগের ঘরে ফিরে যাওয়া
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // ৩. কপি-পেস্ট সাপোর্ট (মূল পরিবর্তন এখানে)
            input.addEventListener('paste', (e) => {
                e.preventDefault(); // ডিফল্ট পেস্ট বন্ধ করা
                const data = e.clipboardData.getData('text').trim();
                
                // শুধু সংখ্যা কি না চেক করা (যদি শুধু ৬ ডিজিট হয়)
                if (!/^\d+$/.test(data)) return;

                const characters = data.split('');
                
                characters.forEach((char, i) => {
                    if (index + i < inputs.length) {
                        inputs[index + i].value = char;
                    }
                });

                // পেস্ট হওয়ার পর শেষ ঘরে ফোকাস নেওয়া বা ফর্ম সাবমিট করা
                const lastInputIndex = Math.min(index + characters.length - 1, inputs.length - 1);
                inputs[lastInputIndex].focus();
                
                combineOtp();
            });
        });

        function combineOtp() {
            let otp = "";
            inputs.forEach(input => otp += input.value);
            fullOtpInput.value = otp;
        }

        form.addEventListener('submit', () => {
            combineOtp();
        });
    </script>
</body>
</html>

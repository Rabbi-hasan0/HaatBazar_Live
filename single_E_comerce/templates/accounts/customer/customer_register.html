{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | HaatBazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">

    <link rel="stylesheet" href="{% static 'css/admin/customer_reg.css' %}">
</head>

<body>
<div class="container my-lg-5 my-md-4 my-3">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-10">
            <div class="card reg-card">
                <div class="reg-header">
                    <h2 class="display-text">Create an Account on <span class="project-name-highlight">HaatBazar</span></h2>
                    <p class="mb-0 opacity-75 fw-light">Join us today for a seamless shopping experience</p>

                </div>
                
                <div class="card-body p-4 p-md-5">
                    {% if messages %}
                        <div class="messages-container mb-4">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
                                    
                                    <div class="alert-text-content text-start">
                                        <i class="fa-solid fa-circle-exclamation text-danger"></i>
                                        {{ message|safe }}
                                    </div>
                                    
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label fw-bold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="Enter your name" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                    <input type="text" name="phone" class="form-control" placeholder="Enter your phone" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Date of Birth</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-regular fa-calendar-days"></i></span>
                                    <input type="text" id="dob_picker" name="date_of_birth" class="form-control bg-white" placeholder="Select Date" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Gender</label>
                                <select name="gender" class="form-select custom-input-border" required>
                                    <option value="" selected disabled>Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Profile Picture</label>
                            <input type="file" name="profile_pic" class="form-control profile-upload custom-input-border" accept="image/*">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Give the password and keep in mine" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-register w-100 shadow-sm">
                            Sign Up Now
                        </button>
                    </form>

                    <div class="divider"><span>OR</span></div>
                    <div class="text-center">
                        <p class="mb-3 small text-muted">Already have an account? <a href="{% url 'customer_login' %}" class="fw-bold text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // Flatpickr initialization
    flatpickr("#dob_picker", {
        dateFormat: "Y-m-d",
        maxDate: "today",       // Aajker porer date select kora jabe na
        altInput: true,         // Display te ekrokom, server e arek rokom data jabe
        altFormat: "F j, Y",    // User dekhbe: January 1, 1990
        allowInput: true,
        monthSelectorType: "dropdown", // Month dropdown theke select kora jabe
        yearSelectorType: "static",    // Year selection dropdown mode e thakbe
        showMonths: 1,
        // Year selection range fix kora (e.g. 100 years back)
        onReady: function(selectedDates, dateStr, instance) {
            const yearInput = instance.calendarContainer.querySelector(".numInput.cur-year");
            if(yearInput) {
                yearInput.removeAttribute("readonly");
            }
        }
    });
</script>
</body>
</html>

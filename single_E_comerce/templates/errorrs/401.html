{% extends "admin_site/admin_base.html" %}

{% block content %}
<div class="error-container d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="error-card text-center">
                    <div class="error-icon-wrapper">
                        <i class="bi bi-shield-lock-fill display-1 text-danger"></i>
                    </div>
                    
                    <h1 class="error-title mt-4">401</h1>
                    <h2 class="error-subtitle">Unauthorized Error</h2>
                    <p class="error-text text-muted mb-5">
                        Oops! It seems you've wandered into a restricted area. 
                        You don't have the necessary permissions to view this page.
                    </p>
                    
                    <div class="action-buttons">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-4 me-md-2 rounded-pill shadow-sm">
                            <i class="bi bi-arrow-left me-2"></i> Go Back
                        </a>
                        <a href="#" class="btn btn-primary btn-lg px-4 rounded-pill shadow">
                            <i class="bi bi-house-door me-2"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* background styling */
    .error-container {
        min-height: 80vh;
        background: #f8fafc;
    }

    .error-card {
        background: white;
        padding: 50px 40px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        border: 1px solid #edf2f7;
        transition: transform 0.3s ease;
    }

    .error-card:hover {
        transform: translateY(-5px);
    }

    .error-icon-wrapper {
        animation: pulse 2s infinite;
    }

    .error-title {
        font-size: 6rem;
        font-weight: 800;
        background: linear-gradient(45deg, #16753a, #be123c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 0;
    }

    .error-subtitle {
        font-size: 1.8rem;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 15px;
    }

    .error-text {
        font-size: 1.1rem;
        max-width: 80%;
        margin: 0 auto;
    }

    .btn-primary {
        background: #4e73df;
        border: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* Mobile Responsive */
    @media screen and (max-width: 767px) {
        .error-title { font-size: 4rem; }
        .error-subtitle { font-size: 1.4rem; }
        .error-card { padding: 40px 20px; }
        .action-buttons .btn {
            width: 100%;
            margin-bottom: 10px;
            margin-right: 0 !important;
        }
    }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}

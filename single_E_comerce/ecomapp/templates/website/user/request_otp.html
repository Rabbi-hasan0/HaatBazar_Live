{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request OTP | Security</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link href="{% static 'website/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .request-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: #fff3cd;
            color: #ffc107;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }
        .form-control-custom {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #eaedf1;
        }
        .form-control-custom:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }
        .btn-request {
            background: #0d6efd;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-request:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
        }
        /* Error Message Style */
        .alert-error, .alert-danger {
            color: #d90429 !important;
            background-color: #fff5f5 !important;
            border: 1px solid #ffccd5 !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card request-card p-4">
                    <div class="text-center mt-3">
                        <div class="icon-box">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Get OTP</h3>
                        <p class="text-muted px-2">Enter your registered email address to receive a verification code.</p>
                    </div>

                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show small py-2" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.7rem;"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px; border: 2px solid #eaedf1;">
                                        <i class="fa-solid fa-envelope text-muted"></i>
                                    </span>
                                    <input type="email" 
                                           name="email" 
                                           class="form-control form-control-custom border-start-0" 
                                           placeholder="example@mail.com" 
                                           style="border-radius: 0 12px 12px 0;"
                                           required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-request w-100 shadow-sm">
                                Send Verification Code
                            </button>
                        </form>
                    </div>
                    
                    <div class="text-center mb-4">
                        <a href="{% url 'user_login' %}" class="text-decoration-none small text-secondary">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login or Register
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
